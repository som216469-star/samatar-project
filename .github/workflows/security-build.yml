name: DUGSI PRO Security & Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run lint

      - name: Students production contract checks
        run: bun run test:students-contract

      - name: Attendance production contract checks
        run: bun run test:attendance-contract

      - name: Authentication contract checks
        run: bun run test:auth-contract

      - name: Authentication session tests
        run: bun run test:auth-session

      - name: Production build
        run: bun run build

      - name: Runtime smoke test
        run: node scripts/server-smoke.mjs

      - name: Audit production dependencies
        run: bun audit --omit=dev --audit-level=high
