name: Bootstrap Capacitor native projects

on:
  push:
    branches:
      - mobile/capacitor-native-foundation
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - capacitor.config.json
      - vite.config.ts
      - .env.mobile
      - src/lib/authStorage.ts
      - src/lib/apiClient.ts
      - src/App.tsx
      - server.ts
      - .github/workflows/bootstrap-capacitor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mobile foundation branch
        uses: actions/checkout@v4
        with:
          ref: mobile/capacitor-native-foundation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Regenerate npm and Bun lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          bun install --lockfile-only

      - name: Install from the regenerated npm lockfile
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run web contract checks
        run: |
          npm run test:students-contract
          npm run test:attendance-contract
          npm run test:mobile-contract

      - name: Build production web service for Render
        run: npm run build

      - name: Build isolated Capacitor web assets
        run: npm run build:mobile

      - name: Generate Android native project
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate iOS native project with Swift Package Manager
        run: |
          if [ ! -d ios ]; then npx cap add ios --packagemanager SPM; fi

      - name: Synchronize Capacitor native projects
        run: npx cap sync

      - name: Verify generated native scaffolds
        run: |
          test -d android/app/src/main
          test -d ios/App
          test -f capacitor.config.json
          echo "Android and iOS native project scaffolds were generated."

      - name: Commit generated lockfiles and native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lock android ios
          if git diff --cached --quiet; then
            echo "Lockfiles and native project scaffolds are already up to date."
          else
            git commit -m "Generate Capacitor lockfiles and native project scaffolds"
            git push origin HEAD:mobile/capacitor-native-foundation
          fi
