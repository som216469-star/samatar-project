name: Repair Render-compatible build and verify

on:
  push:
    branches:
      - render-build-fix
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/regenerate-lock.yml"

permissions:
  contents: write

jobs:
  lockfile-and-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: render-build-fix
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Regenerate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking fixes for audited production dependencies
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile to fix branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync lockfile for Render-compatible build"
            git push origin HEAD:render-build-fix
          else
            echo "package-lock.json is already synchronized."
          fi

      - name: Clean installation
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Students production contract checks
        run: npm run test:students-contract

      - name: Attendance production contract checks
        run: npm run test:attendance-contract

      - name: Production build
        run: npm run build

      - name: Runtime smoke test
        run: node scripts/server-smoke.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
